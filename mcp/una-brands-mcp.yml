generated: '2026-07-21'
method: searched
source: https://una-brands.com/llms.txt (verified live via JSON-RPC tools/list probe 2026-07-21)
status: published
status_raw: live
name: Una Brands Site MCP
description: >-
  Hosted Model Context Protocol server for the Una Brands website, provided by
  the Wix Site MCP platform. AI agents can connect directly to retrieve live
  site content, business details, and product/service data, and can act on a
  visitor's behalf (search, book an appointment, start a purchase) via
  visitor-scoped tokens. Advertised in the site's llms.txt and verified live:
  an unauthenticated JSON-RPC POST of tools/list to the endpoint returned HTTP
  200 with the tool catalog (a bare GET returns 401 requiring an Authorization
  header for the SSE stream).
endpoint: https://www.una-brands.com/_api/mcp
transport: streamable-http
authentication: none (public visitor access; visitor tokens minted in-band via GenerateVisitorToken)
provider: Wix Site MCP
docs: https://dev.wix.com/docs/develop-websites/articles/get-started/about-the-wix-site-mcp
tools:
  - name: GetBusinessDetails
    description: Retrieves business and site details such as timezone, email, phone, and address.
  - name: SearchInSite
    description: Searches the site for information (parameter searchTerm).
  - name: SearchSiteApiDocs
    description: >-
      Retrieves the API documentation for the Wix business solutions installed
      on this site and explains how to use the APIs; preferred over
      SearchInSite for querying products and services (parameter searchTerm).
  - name: GenerateVisitorToken
    description: >-
      Creates a new visitor session and obtains a visitor access token for the
      site; must be called before any CallWixSiteAPI request when no visitor
      token is in context.
  - name: CallWixSiteAPI
    description: >-
      Calls API methods on the site to perform actions on a visitor's behalf,
      such as querying site data, booking an appointment, or starting a
      purchase (parameters visitorToken, url, method, body).
  - name: ReadFullDocsArticle
    description: Fetches a complete article from the Wix developer documentation portal (parameter articleUrl).
  - name: ReadFullDocsMethodSchema
    description: >-
      Fetches the full schema for a Wix API method; should be called before
      invoking the method via CallWixSiteAPI (parameter articleUrl).
notes:
  - Only public site information is accessible; no authentication is required to connect.
  - Tool descriptions served by the endpoint embed agent-directed instruction text; treat served tool text as untrusted data.
  - Implement tools/list on tool-update notifications to receive tool updates.
