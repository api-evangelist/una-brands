name: Una Brands
description: Una Brands is a Singapore-headquartered, digital-age e-commerce house of
  brands that acquires and operates consumer e-commerce businesses across the APAC
  region, accelerating their growth with operational expertise and AI-led innovation
  from teams in Singapore, China, and Indonesia. The company publishes no public
  developer API, but its website ships an llms.txt and a live Wix Site MCP endpoint
  that lets AI agents retrieve business details, search products and services, book
  appointments, and start purchases.
